<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>МТА 24/7 — Учет Финансов</title>
    <!-- Tailwind CSS & FontAwesome -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-black text-gray-100 antialiased min-h-screen pb-28 select-none">

    <!-- MAIN APP HEADER -->
    <header class="sticky top-0 z-40 backdrop-blur-xl bg-gray-950/90 border-b border-gray-800/80 px-4 py-3">
        <div class="max-w-md mx-auto flex items-center justify-between">
            <div class="flex items-center gap-2.5">
                <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-cyan-500 to-blue-600 flex items-center justify-center text-white shadow-lg">
                    <i class="fa-solid fa-mountain text-lg"></i>
                </div>
                <div>
                    <h1 class="font-black text-lg tracking-wider text-gray-100">МТА 24/7</h1>
                    <div class="text-[9px] text-cyan-400 font-bold">👤 Облако Supabase Active</div>
                </div>
            </div>

            <div class="flex items-center gap-1 bg-gray-900 border border-gray-800 rounded-xl px-2 py-1">
                <span id="currentPeriodLabel" class="text-xs font-bold text-cyan-400 px-1 font-mono">ОКТЯБРЬ 2026</span>
            </div>
        </div>
    </header>

    <!-- ОСНОВНОЙ КОНТЕЙНЕР -->
    <main class="max-w-md mx-auto px-4 mt-4 space-y-5">

        <!-- ВКЛАДКА 1: ПАНЕЛЬ -->
        <div id="tab-panel" class="tab-content space-y-5">
            
            <!-- ДОХОДЫ -->
            <section class="space-y-2">
                <div class="flex justify-between items-center">
                    <span class="text-xs font-bold text-gray-400 uppercase tracking-wider">Доходы за месяц</span>
                    <span id="totalIncomeHeader" class="text-sm font-black font-mono text-emerald-400">0 сом</span>
                </div>
                <div id="incomeList" class="grid grid-cols-3 gap-2"></div>
            </section>

            <!-- КОШЕЛЬКИ -->
            <section class="space-y-2">
                <div class="flex justify-between items-center">
                    <span class="text-xs font-bold text-gray-400 uppercase tracking-wider">Мои Кошельки</span>
                    <span id="totalWalletHeader" class="text-sm font-black font-mono text-cyan-400">0 сом</span>
                </div>
                <div id="walletList" class="grid grid-cols-3 gap-2"></div>
            </section>

            <!-- РАСХОДЫ ПО КАТЕГОРИЯМ -->
            <section class="space-y-2">
                <div class="flex justify-between items-center">
                    <span class="text-xs font-bold text-gray-400 uppercase tracking-wider">Расходы за месяц</span>
                    <span id="totalExpenseHeader" class="text-sm font-black font-mono text-rose-400">0 сом</span>
                </div>
                <div id="categoryGrid" class="grid grid-cols-2 gap-2"></div>
            </section>
        </div>

        <!-- ВКЛАДКА 2: ИСТОРИЯ -->
        <div id="tab-history" class="tab-content hidden space-y-3">
            <div class="flex justify-between items-center bg-gray-900/80 p-3 rounded-2xl border border-gray-800">
                <span class="text-xs font-bold text-gray-400">Все операции:</span>
            </div>
            <div id="historyList" class="space-y-2 max-h-[500px] overflow-y-auto"></div>
        </div>

        <!-- ВКЛАДКА 3: ОТЧЕТ -->
        <div id="tab-reports" class="tab-content hidden space-y-4">
            <div class="bg-gray-900/90 p-4 rounded-2xl border border-gray-800 text-center text-xs text-gray-400">
                Облачная синхронизация активна 24/7.
            </div>
        </div>

        <!-- ВКЛАДКА 4: НАСТРОЙКИ -->
        <div id="tab-settings" class="tab-content hidden space-y-4">
            <div class="bg-gray-900/90 p-4 rounded-2xl border border-gray-800 space-y-2 text-xs">
                <h3 class="font-bold text-sm text-gray-200">База данных</h3>
                <p class="text-emerald-400 font-bold">🟢 Supabase Подключен</p>
            </div>
        </div>

    </main>

    <!-- НИЖНЯЯ НАВИГАЦИОННАЯ ПАНЕЛЬ -->
    <nav class="fixed bottom-0 inset-x-0 bg-gray-950/95 backdrop-blur-xl border-t border-gray-800/80 z-40 py-2 px-4">
        <div class="max-w-md mx-auto flex justify-between items-center text-[10px] font-bold text-gray-400">
            <button onclick="switchTab('panel')" id="nav-panel" class="nav-item flex flex-col items-center gap-1 text-cyan-400">
                <i class="fa-solid fa-grid-2 text-base"></i>
                <span>Панель</span>
            </button>
            <button onclick="switchTab('history')" id="nav-history" class="nav-item flex flex-col items-center gap-1 hover:text-gray-200">
                <i class="fa-solid fa-list-ul text-base"></i>
                <span>История</span>
            </button>

            <button onclick="openAddTransactionModal()" class="w-12 h-12 -mt-5 rounded-full bg-gradient-to-tr from-cyan-500 to-blue-600 text-white text-xl flex items-center justify-center shadow-xl active:scale-90 transition-all border-2 border-black">
                <i class="fa-solid fa-plus"></i>
            </button>

            <button onclick="switchTab('reports')" id="nav-reports" class="nav-item flex flex-col items-center gap-1 hover:text-gray-200">
                <i class="fa-solid fa-chart-pie text-base"></i>
                <span>Отчет</span>
            </button>
            <button onclick="switchTab('settings')" id="nav-settings" class="nav-item flex flex-col items-center gap-1 hover:text-gray-200">
                <i class="fa-solid fa-gear text-base"></i>
                <span>Настройки</span>
            </button>
        </div>
    </nav>

    <!-- МОДАЛЬНОЕ ОКНО ДОБАВЛЕНИЯ -->
    <div id="addModal" class="fixed inset-0 z-50 bg-black/85 backdrop-blur-md flex items-end sm:items-center justify-center p-0 sm:p-4 hidden">
        <div class="bg-gray-900 border border-gray-800 rounded-t-3xl sm:rounded-3xl max-w-md w-full p-5 space-y-4 shadow-2xl">
            <div class="flex justify-between items-center border-b border-gray-800 pb-3">
                <div class="flex bg-gray-950 p-1 rounded-xl border border-gray-800 w-48 text-xs font-bold">
                    <button type="button" onclick="setTxType('expense')" id="txTypeExp" class="flex-1 py-1 rounded-lg bg-rose-500 text-white font-extrabold">Расход</button>
                    <button type="button" onclick="setTxType('income')" id="txTypeInc" class="flex-1 py-1 rounded-lg text-gray-400">Доход</button>
                </div>
                <button onclick="closeAddModal()" class="text-gray-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>

            <form onsubmit="handleSaveTransaction(event)" class="space-y-3 text-xs">
                <div>
                    <label class="text-gray-400 block mb-1">Сумма (сом):</label>
                    <input type="number" id="txAmount" placeholder="0" required class="w-full bg-gray-950 border border-gray-800 rounded-xl px-3 py-2.5 text-lg font-mono text-cyan-400 font-bold focus:outline-none focus:border-cyan-500">
                </div>

                <div>
                    <label class="text-gray-400 block mb-1">Название:</label>
                    <input type="text" id="txTitle" placeholder="Продукты, Обед..." required class="w-full bg-gray-950 border border-gray-800 rounded-xl px-3 py-2 text-gray-200 focus:outline-none">
                </div>

                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="text-gray-400 block mb-1">Кошелек:</label>
                        <select id="txWallet" class="w-full bg-gray-950 border border-gray-800 rounded-xl px-2.5 py-2 text-gray-200 font-semibold">
                            <option value="Оптима">Оптима</option>
                            <option value="MBank">MBank</option>
                            <option value="Наличные">Наличные</option>
                        </select>
                    </div>
                    <div>
                        <label class="text-gray-400 block mb-1">Категория:</label>
                        <select id="txCategory" class="w-full bg-gray-950 border border-gray-800 rounded-xl px-2.5 py-2 text-gray-200 font-semibold">
                            <option value="Еда & Продукты">Еда & Продукты</option>
                            <option value="Транспорт">Транспорт</option>
                            <option value="Жилье & Комуналка">Жилье & Комуналка</option>
                            <option value="Развлечения">Развлечения</option>
                            <option value="Зарплата">Зарплата</option>
                        </select>
                    </div>
                </div>

                <button type="submit" class="w-full bg-cyan-500 hover:bg-cyan-400 text-black font-extrabold py-3 rounded-xl transition-all shadow-lg text-sm mt-2">
                    Сохранить в облако ☁️
                </button>
            </form>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
