<!-- ЭКРАН АВТОРИЗАЦИИ / ВХОДА -->
<div id="authScreen" class="fixed inset-0 z-50 bg-gray-950 flex items-center justify-center p-4">
    <div class="bg-gray-900 border border-gray-800 p-6 rounded-3xl max-w-sm w-full text-center space-y-4 shadow-2xl">
        <div class="w-16 h-16 bg-cyan-500/20 text-cyan-400 rounded-full flex items-center justify-center mx-auto text-2xl font-bold border border-cyan-500/30">
            <i class="fa-solid fa-wallet"></i>
        </div>
        <div>
            <h2 class="text-xl font-bold text-gray-100">МТА 24/7</h2>
            <p class="text-xs text-gray-400 mt-1">Введите ваше имя или логин для входа в личный кабинет</p>
        </div>
        <form onsubmit="handleLogin(event)" class="space-y-3">
            <input type="text" id="usernameInput" placeholder="Например: nurlan" required 
                   class="w-full bg-gray-950 border border-gray-800 rounded-xl px-4 py-3 text-sm text-gray-100 focus:outline-none focus:border-cyan-500 transition-colors text-center">
            <button type="submit" class="w-full bg-gradient-to-r from-cyan-500 to-blue-600 text-black font-extrabold py-3 rounded-xl hover:opacity-90 transition-opacity">
                Войти в кабинет
            </button>
        </form>
    </div>
</div>
